<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="section">
         <div class="search">
        <input type="text" class="sbar" placeholder="Enter the city">
        <button><img src="search.png" alt="search"></button>
    </div>
    <div class="weatherimg">
        <img src="clouds.png" alt="cloud">
    </div>
    <div class="temp">
        <h1>degree</h1>
        <p>city</p>
    </div>
    <div class="foot">
        <div class="humid">
            <img src="humidity.png" alt="humidity">
            <div class="humidcont">
                <p>value</p>
           <h1>Humidity</h1>
            </div>
            
        </div>
        <div class="wind">
            <img src="wind.png" alt="wind-speed">
            <div class="windcont">
                <p>value</p>
            <h1>Wind Speed</h1>
            </div>
        </div>
    </div>
    </div>
   
    <script src="script.js"></script>
</body>
</html>
